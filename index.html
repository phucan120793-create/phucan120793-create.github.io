<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Logo thật của AOTA (cá koi + sen) — dùng làm icon tab trình
         duyệt VÀ icon app khi "Thêm vào Màn hình chính" (apple-touch-icon
         bên dưới, + icons trong manifest.webmanifest), thay cho icon
         tím trừu tượng mặc định trước đây. -->
    <link rel="icon" type="image/png" href="./aota-logo.png" />
    <!-- viewport-fit=cover: bắt buộc để env(safe-area-inset-*) (HUD —
         xem App.css) thật sự có giá trị khác 0 trên iPhone có notch/
         Dynamic Island/thanh cử chỉ, thay vì luôn bằng 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AOTA — Vietnamese Village Pond</title>

    <!-- Open Graph — đọc bởi Facebook/Messenger/Zalo... khi ai đó dán
         link game vào khung chat/bài đăng, để hiện sẵn tiêu đề + mô tả
         đẹp thay vì chỉ 1 dòng URL trần. sharer.php của Facebook không
         còn nhận text tùy ý qua query string (?quote= đã bị bỏ từ lâu)
         — đây mới là cách CHÍNH THỨC để "soạn sẵn vài dòng giới thiệu"
         khi chia sẻ, xem thêm attemptShare() trong QuestContext.jsx. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AOTA — Ao Làng Việt Nam" />
    <meta
      property="og:description"
      content="Nuôi cá, chăm ao, khám phá một góc quê hương Đồng Tháp Mười ngay trên trình duyệt — chơi miễn phí, không cần cài đặt."
    />
    <meta property="og:image" content="./aota-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AOTA — Ao Làng Việt Nam" />
    <meta
      name="twitter:description"
      content="Nuôi cá, chăm ao, khám phá một góc quê hương Đồng Tháp Mười ngay trên trình duyệt."
    />
    <meta name="twitter:image" content="./aota-logo.png" />

    <!-- PWA — "Thêm vào MH chính" trên iPhone/Android chạy ở chế độ
         standalone (display:standalone trong manifest), ẩn HẲN thanh
         địa chỉ/thanh công cụ trình duyệt — cách DUY NHẤT thật sự đáng
         tin cậy để làm việc này trên Safari iOS (Fullscreen API — nút
         ⛶ trong thanh điều khiển camera — chỉ hỗ trợ từ iOS 16.4 trở
         lên và cần bấm tay mỗi lần mở lại trang, không tự nhớ). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0a1a18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AOTA" />
    <link rel="apple-touch-icon" href="./aota-logo.png" />
    <script type="module" crossorigin src="./assets/index-D8O1qf4M.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/soundManager-GkrY2amc.js">
    <link rel="modulepreload" crossorigin href="./assets/saveManager-BpBkAeM0.js">
    <link rel="modulepreload" crossorigin href="./assets/FishRosterContext-DUUIxR1C.js">
    <link rel="modulepreload" crossorigin href="./assets/fishModelLoader-D3ACex0E.js">
    <link rel="stylesheet" crossorigin href="./assets/index-Dziv69B-.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
